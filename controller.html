<!doctype html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="controller.css">
  <title>NesJS — Controller Settings</title>
</head>
<body>
  <nav><a href="index.html">← Back to NesJS</a></nav>
  <h1>🎮 Controller Settings</h1>
  <h2>Map gamepad buttons to NES inputs for each player</h2>

  <div class="tabs">
    <button class="tab-btn active" id="tab-p1">Player 1</button>
    <button class="tab-btn" id="tab-p2">Player 2</button>
  </div>

  <table class="mapping-table">
    <thead>
      <tr>
        <th>NES Button</th>
        <th>Assigned Gamepad Input</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="mapping-body">
      <!-- Filled by controller.js -->
    </tbody>
  </table>

  <div class="actions">
    <button id="btn-reset">Reset to Defaults</button>
    <button id="btn-save">💾 Save</button>
    <span class="status-msg" id="save-status"></span>
  </div>

  <div class="export-import">
    <h3>Export / Import Mappings</h3>
    <textarea id="mapping-textarea" placeholder="Mapping JSON will appear here..."></textarea>
    <div class="ei-buttons">
      <button id="btn-export-json">Export JSON</button>
      <button id="btn-export-js">Export as JS</button>
      <button id="btn-import">Import</button>
    </div>
    <div class="ei-status" id="ei-status"></div>
  </div>

  <script src="js/controller.js"></script>
</body>
</html>
